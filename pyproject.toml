[project]
name = "data-center"
version = "0.1.0"
description = "Evidence-backed device operation and maintenance query service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
local-stack = ["psycopg[binary]>=3.2,<4", "pgvector==0.5.1", "celery==5.3.4"]
local-pdf = ["PyMuPDF>=1.27,<2"]
local-chunks = ["tokenizers==0.22.2"]
local-embedding = [
  "sentence-transformers==5.5.0",
  "torch==2.12.0",
  "transformers==5.8.1",
  "tokenizers==0.22.2",
  "numpy==2.4.2",
]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["."]
addopts = "-q"
